<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>My Room Air Quality</title>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Luxon + adapter for time axis -->
  <script src="https://cdn.jsdelivr.net/npm/luxon@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon"></script>

  <style>
    body { background: #1e1e1e; color: #eee; font-family: sans-serif; padding: 1rem; }
    h1 { text-align: center; margin-bottom: 2rem; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
    canvas { background: #2a2a2a; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>My Room Air Quality</h1>
  <div class="grid">
    <canvas id="chart-temp"></canvas>
    <canvas id="chart-hum"></canvas>
    <canvas id="chart-pres"></canvas>
    <canvas id="chart-light"></canvas>
  </div>

  <script>
  const account   = 'homeoffice1';
  const container = 'telementry';
  const sasToken  = 'sv=2024-11-04&ss=bfqt&srt=co&sp=rwdlacupiytfx&se=2026-05-01T19:22:12Z&st=2025-05-01T11:22:12Z&spr=https&sig=F1rO3kwekla0ZgwLntABz5KzbhufD1S4zxLMfAsHbTk%3D';  // no leading "?"
  const baseUrl   = `https://${account}.blob.core.windows.net/${container}`;

  // 1) List all JSON blobs in the container
  async function listBlobs() {
    try {
      console.log(`Listing blobs from ${baseUrl}`);
      const url = `${baseUrl}?restype=container&comp=list&${sasToken}`;
      const res = await fetch(url);
      
      if (!res.ok) {
        throw new Error(`Failed to list blobs: ${res.status} ${res.statusText}`);
      }
      
      const xml = await res.text();
      console.log("XML response received, length:", xml.length);
      
      const dom = new DOMParser().parseFromString(xml, 'application/xml');
      const blobs = Array.from(dom.getElementsByTagName('Blob'))
        .map(b => b.getElementsByTagName('Name')[0].textContent)
        .filter(n => n.endsWith('.json'));
      
      console.log(`Found ${blobs.length} JSON blobs`);
      if (blobs.length > 0) {
        console.log("First blob:", blobs[0]);
      } else {
        console.warn("No JSON blobs found in container");
      }
      
      return blobs;
    } catch (error) {
      console.error("Error listing blobs:", error);
      throw error;
    }
  }

  // 2) Download & concatenate all JSON arrays
  async function loadData() {
    try {
      const names = await listBlobs();
      if (!names || names.length === 0) {
        console.warn("No blobs found to load");
        return [];
      }
      
      let all = [];
      for (let name of names) {
        console.log(`Loading blob: ${name}`);
        try {
          const r = await fetch(`${baseUrl}/${name}?${sasToken}`);
          
          if (!r.ok) {
            console.error(`Failed to fetch ${name}: ${r.status} ${r.statusText}`);
            continue;
          }
          
          const text = await r.text();
          console.log(`Received data for ${name}, length: ${text.length}`);
          
          try {
            const j = JSON.parse(text);
            // IoT Hub writes an array of messages per blob
            if (Array.isArray(j)) {
              console.log(`${name} contains an array of ${j.length} items`);
              all = all.concat(j);
            } else {
              console.log(`${name} contains a single object`);
              all.push(j);
            }
          } catch (parseError) {
            console.error(`Error parsing JSON from ${name}:`, parseError);
            console.log("First 100 chars:", text.substring(0, 100));
          }
        } catch (fetchError) {
          console.error(`Error fetching blob ${name}:`, fetchError);
        }
      }
      
      console.log(`Total data points loaded: ${all.length}`);
      return all;
    } catch (error) {
      console.error("Error in loadData:", error);
      document.body.innerHTML += `<div style="color:orange;padding:20px;text-align:center">Error loading data: ${error.message}. Check browser console for details.</div>`;
      return [];
    }
  }

  // 3) Turn raw into timeseries
  function prep(raw) {
    try {
      // Extract the Body content from each message
      const extractBody = (item) => {
        if (!item) return null;
        
        // If Body is present and is a string, parse it
        if (item.Body) {
          try {
            // If Body is a JSON string, parse it
            if (typeof item.Body === 'string') {
              return JSON.parse(item.Body);
            }
            // If Body is already an object, use it directly
            return item.Body;
          } catch (e) {
            console.error("Error parsing Body:", e);
            return null;
          }
        }
        // If no Body field, return the item itself (maybe it's already extracted)
        return item;
      };
      
      // Map each raw item to its Body content and filter out nulls
      const validData = raw.map(extractBody).filter(Boolean);
      console.log("First extracted body:", validData[0]);
      
      // Sort by timestamp
      validData.sort((a,b) => {
        // Use EnqueuedTimeUtc if no timestamp in the body
        const timeA = a.timestamp || (raw.find(r => r.Body === JSON.stringify(a))?.EnqueuedTimeUtc);
        const timeB = b.timestamp || (raw.find(r => r.Body === JSON.stringify(b))?.EnqueuedTimeUtc);
        return new Date(timeA) - new Date(timeB);
      });
      
      // Log the actual property names of first valid body
      if (validData.length > 0) {
        console.log("Body properties:", Object.keys(validData[0]).join(", "));
      }
      
      return {
        times: validData.map(d => new Date(d.timestamp || raw.find(r => r.Body === JSON.stringify(d))?.EnqueuedTimeUtc)),
        temp: validData.map(d => parseFloat(d.temperature || d.temp)).filter(n => !isNaN(n)),
        hum: validData.map(d => parseFloat(d.humidity || d.hum)).filter(n => !isNaN(n)),
        pres: validData.map(d => parseFloat(d.pressure || d.pres || 1009)).filter(n => !isNaN(n)),
        light: validData.map(d => parseFloat(d.light)).filter(n => !isNaN(n)),
        co2: validData.map(d => parseFloat(d.co2)).filter(n => !isNaN(n))
      };
    } catch (err) {
      console.error("Error in prep:", err);
      return { times: [], temp: [], hum: [], pres: [], light: [], co2: [] };
    }
  }

  // 4) Draw charts
  function draw(id, label, data, unit) {
    new Chart(document.getElementById(id), {
      type: 'line',
      data: {
        labels: data.times,
        datasets: [{
          label,
          data,
          borderColor: '#22ddaa',
          borderWidth: 2,
          pointRadius: 0,
          fill: false
        }]
      },
      options: {
        responsive: true,
        scales: {
          x: { type: 'time', time: { tooltipFormat: 'HH:mm' }, grid: { color: '#444' } },
          y: { title: { display: true, text: unit } }
        },
        plugins: {
          legend: { labels: { color: '#ccc' } },
          title: { display: true, text: `${label}: ${data[data.length-1]} ${unit}`, color: '#fff' }
        }
      }
    });
  }

  // 5) Main
  loadData().then(raw => {
    // Debug the data
    console.log("First data point sample:", raw[0]);
    document.body.innerHTML += `<div style="color:white;padding:20px;">Data keys in first item: ${Object.keys(raw[0]).join(', ')}</div>`;
    
    // Check which properties exist in the data
    const hasTemp = raw[0].hasOwnProperty('temperature');
    const hasHumidity = raw[0].hasOwnProperty('humidity');
    const hasLight = raw[0].hasOwnProperty('light');
    const hasCo2 = raw[0].hasOwnProperty('co2');
    
    console.log(`Data properties: temp=${hasTemp}, humidity=${hasHumidity}, light=${hasLight}, co2=${hasCo2}`);
    
    const {times,temp,hum,pres,light,co2} = prep(raw);
    
    // Debug the processed data
    console.log("Processed data lengths:", {
      times: times.length,
      temp: temp.length,
      hum: hum.length,
      pres: pres.length,
      light: light.length,
      co2: co2.length
    });
    
    // Only draw charts if we have data
    if (temp.length) draw('chart-temp', 'Temperature', temp, '°C');
    if (hum.length) draw('chart-hum', 'Humidity', hum, '%RH');
    if (pres.length) draw('chart-pres', 'Pressure', pres, 'hPa');
    if (light.length) draw('chart-light', 'Light', light, 'Lux');
  })
  .catch(e=> {
    console.error('Error loading/plotting data', e);
    document.body.innerHTML += `<div style="color:red;padding:20px;">Error: ${e.message}</div>`;
  });
  </script>
</body>
</html>
