<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>My Room Air Quality</title>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Luxon + adapter for time axis -->
  <script src="https://cdn.jsdelivr.net/npm/luxon@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon"></script>
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body { 
      background: #222; 
      color: #eee; 
      font-family: Arial, sans-serif; 
      padding: 0; 
      margin: 0;
      max-width: 1200px;
      margin: 0 auto;
    }
    
    h1 { 
      text-align: center; 
      margin: 1.5rem 0; 
      font-size: 1.8rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .grid { 
      display: grid; 
      grid-template-columns: 1fr 1fr; 
      gap: 1.2rem; 
      padding: 0 1rem 1.5rem;
    }
    
    .chart-container {
      background: #2a2a2a;
      border-radius: 5px;
      padding: 1.2rem 0.5rem 0.8rem;
      position: relative;
    }
    
    .current-value {
      margin-bottom: 1rem;
      padding: 0 1rem;
      display: flex;
      align-items: center;
    }
    
    .current-value i {
      margin-right: 0.5rem;
      color: #eee;
      font-size: 1.2rem;
      width: 20px;
      text-align: center;
    }
    
    .value-label {
      font-size: 1rem;
      text-transform: uppercase;
      font-weight: 500;
      margin-right: 0.5rem;
    }
    
    .value-number {
      font-size: 1.1rem;
      font-weight: bold;
      color: #fff;
    }
    
    .value-unit {
      font-size: 0.9rem;
      color: #bbb;
      margin-left: 0.2rem;
    }
    
    canvas {
      width: 100% !important;
      height: auto !important;
    }
  </style>
</head>
<body>
  <h1>
    MY ROOM AIR QUALITY 
    <i class="fa-solid fa-house"></i>
  </h1>
  
  <div class="grid">
    <div class="chart-container">
      <div class="current-value">
        <i class="fas fa-temperature-half"></i>
        <span class="value-label">TEMPERATURE:</span>
        <span class="value-number" id="current-temp">--.-</span>
        <span class="value-unit">°C</span>
      </div>
      <canvas id="chart-temp"></canvas>
    </div>
    
    <div class="chart-container">
      <div class="current-value">
        <i class="fas fa-droplet"></i>
        <span class="value-label">HUMIDITY:</span>
        <span class="value-number" id="current-hum">--.-</span>
        <span class="value-unit">%RH</span>
      </div>
      <canvas id="chart-hum"></canvas>
    </div>
    
    <div class="chart-container">
    <div class="current-value">
        <i class="fas fa-sun"></i>
        <span class="value-label">PRESSURE:</span>
        <span class="value-number" id="current-pres">----</span>
        <span class="value-unit">hPa</span>
      </div>
      <canvas id="chart-pres"></canvas>
    </div>
    
    <div class="chart-container">
      <div class="current-value">
        <i class="far fa-lightbulb"></i>
        <span class="value-label">LIGHT:</span>
        <span class="value-number" id="current-light">--</span>
        <span class="value-unit">LUX</span>
      </div>
      <canvas id="chart-light"></canvas>
    </div>
  </div>

  <script>
  const account   = 'homeoffice1';
  const container = 'telementry';
  const sasToken  = 'sv=2024-11-04&ss=bfqt&srt=co&sp=rwdlacupiytfx&se=2026-05-01T19:22:12Z&st=2025-05-01T11:22:12Z&spr=https&sig=F1rO3kwekla0ZgwLntABz5KzbhufD1S4zxLMfAsHbTk%3D';  // no leading "?"
  const baseUrl   = `https://${account}.blob.core.windows.net/${container}`;

  // Chart configuration
  const chartConfig = {
    lineColor: '#22ddcc',
    bgColor: '#2a2a2a',
    gridColor: '#3a3a3a',
    fontColor: '#ddd',
    titleColor: '#fff'
  };

  // 1) List all JSON blobs in the container
  async function listBlobs() {
    try {
      console.log(`Listing blobs from ${baseUrl}`);
      const url = `${baseUrl}?restype=container&comp=list&${sasToken}`;
      const res = await fetch(url);
      
      if (!res.ok) {
        throw new Error(`Failed to list blobs: ${res.status} ${res.statusText}`);
      }
      
      const xml = await res.text();
      console.log("XML response received, length:", xml.length);
      
      const dom = new DOMParser().parseFromString(xml, 'application/xml');
      const blobs = Array.from(dom.getElementsByTagName('Blob'))
        .map(b => b.getElementsByTagName('Name')[0].textContent)
        .filter(n => n.endsWith('.json'));
      
      console.log(`Found ${blobs.length} JSON blobs`);
      if (blobs.length > 0) {
        console.log("First blob:", blobs[0]);
      } else {
        console.warn("No JSON blobs found in container");
      }
      
      return blobs;
    } catch (error) {
      console.error("Error listing blobs:", error);
      throw error;
    }
  }

  // 2) Download & concatenate all JSON arrays
  async function loadData() {
    try {
      const names = await listBlobs();
      if (!names || names.length === 0) {
        console.warn("No blobs found to load");
        return [];
      }
      
      let all = [];
      for (let name of names) {
        console.log(`Loading blob: ${name}`);
        try {
          const r = await fetch(`${baseUrl}/${name}?${sasToken}`);
          
          if (!r.ok) {
            console.error(`Failed to fetch ${name}: ${r.status} ${r.statusText}`);
            continue;
          }
          
          const text = await r.text();
          console.log(`Received data for ${name}, length: ${text.length}`);
          
          try {
            const j = JSON.parse(text);
            // IoT Hub writes an array of messages per blob
            if (Array.isArray(j)) {
              console.log(`${name} contains an array of ${j.length} items`);
              all = all.concat(j);
            } else {
              console.log(`${name} contains a single object`);
              all.push(j);
            }
          } catch (parseError) {
            console.error(`Error parsing JSON from ${name}:`, parseError);
            console.log("First 100 chars:", text.substring(0, 100));
          }
        } catch (fetchError) {
          console.error(`Error fetching blob ${name}:`, fetchError);
        }
      }
      
      console.log(`Total data points loaded: ${all.length}`);
      return all;
    } catch (error) {
      console.error("Error in loadData:", error);
      document.body.innerHTML += `<div style="color:orange;padding:20px;text-align:center">Error loading data: ${error.message}. Check browser console for details.</div>`;
      return [];
    }
  }

  // 3) Turn raw into timeseries
  function prep(raw) {
    try {
      // Filter out any items without a timestamp
      const validData = raw.filter(d => d && d.timestamp);
      
      // Sort by timestamp
      validData.sort((a,b) => new Date(a.timestamp) - new Date(b.timestamp));
      
      // Extract data with safe access
      const getData = (item, prop, defaultVal = null) => {
        const val = item[prop];
        // Check if the value is a valid number
        return (val !== undefined && val !== null && !isNaN(val)) ? Number(val) : defaultVal;
      };
      
      // Create data series with safe extraction
      return {
        times: validData.map(d => new Date(d.timestamp)),
        temp: validData.map(d => getData(d, 'temperature')).filter(v => v !== null),
        hum: validData.map(d => getData(d, 'humidity')).filter(v => v !== null),
        pres: validData.map(d => getData(d, 'pressure', 1009)).filter(v => v !== null),
        light: validData.map(d => getData(d, 'light')).filter(v => v !== null),
        co2: validData.map(d => getData(d, 'co2')).filter(v => v !== null)
      };
    } catch (err) {
      console.error("Error preparing data:", err);
      // Return empty data structure as fallback
      return { times: [], temp: [], hum: [], pres: [], light: [], co2: [] };
    }
  }

  // 4) Draw charts
  function draw(id, data, unit) {
    return new Chart(document.getElementById(id), {
      type: 'line',
      data: {
        labels: data.times,
        datasets: [{
          data,
          borderColor: chartConfig.lineColor,
          borderWidth: 1.5,
          pointRadius: 0,
          tension: 0.2,
          fill: false
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            display: false
          },
          tooltip: {
            mode: 'index',
            intersect: false,
            backgroundColor: '#111',
            titleColor: '#fff',
            bodyColor: '#ddd',
            borderColor: '#333',
            borderWidth: 1
          }
        },
        scales: {
          x: { 
            type: 'time', 
            time: { 
              unit: 'hour',
              displayFormats: {
                hour: 'HH:mm'
              },
              tooltipFormat: 'HH:mm'
            }, 
            grid: { 
              color: chartConfig.gridColor,
              drawBorder: false
            },
            ticks: {
              color: chartConfig.fontColor,
              maxRotation: 0,
              font: {
                size: 10
              }
            }
          },
          y: { 
            grid: { 
              color: chartConfig.gridColor,
              drawBorder: false
            },
            ticks: {
              color: chartConfig.fontColor,
              font: {
                size: 10
              }
            },
            title: { 
              display: false
            }
          }
        },
        layout: {
          padding: {
            top: 5,
            right: 10,
            bottom: 0,
            left: 10
          }
        },
        elements: {
          line: {
            borderWidth: 1.5
          }
        }
      }
    });
  }

  // 5) Update current value displays
  function updateCurrentValues(data) {
    try {
      // Check if we have any data
      if (!data.temp.length || !data.hum.length || !data.light.length) {
        console.warn("Some data arrays are empty");
        return; // Don't update if no data
      }
      
      // Get the latest values, safely
      const lastTemp = data.temp[data.temp.length-1];
      const lastHum = data.hum[data.hum.length-1];
      const lastPres = data.pres && data.pres.length ? data.pres[data.pres.length-1] : 1009;
      const lastLight = data.light[data.light.length-1];
      
      // Only update if values are valid numbers
      if (typeof lastTemp === 'number') {
        document.getElementById('current-temp').textContent = lastTemp.toFixed(1);
      }
      
      if (typeof lastHum === 'number') {
        document.getElementById('current-hum').textContent = lastHum.toFixed(1);
      }
      
      if (typeof lastPres === 'number') {
        document.getElementById('current-pres').textContent = Math.round(lastPres);
      }
      
      if (typeof lastLight === 'number') {
        document.getElementById('current-light').textContent = Math.round(lastLight);
      }
    } catch (err) {
      console.error("Error updating values:", err);
    }
  }

  // 6) Main
  loadData().then(raw => {
    // Check if we have any data
    if (!raw || !raw.length) {
      throw new Error("No data found in Azure Blob Storage");
    }
    
    const data = prep(raw);
    
    // Log what we found for debugging
    console.log(`Loaded ${raw.length} data points`);
    console.log("Last data point:", raw[raw.length-1]);
    
    // Update current values at the top of charts
    updateCurrentValues(data);
    
    // Draw all charts with safe checks for each dataset
    if (data.temp && data.temp.length) draw('chart-temp', data.temp, '°C');
    if (data.hum && data.hum.length) draw('chart-hum', data.hum, '%RH');
    if (data.pres && data.pres.length) draw('chart-pres', data.pres, 'hPa');
    if (data.light && data.light.length) draw('chart-light', data.light, 'Lux');
    
    // Optional: set up auto-refresh every 5 minutes
    setInterval(() => {
      loadData().then(raw => {
        if (raw && raw.length) {
          const data = prep(raw);
          updateCurrentValues(data);
        }
      }).catch(e => console.error("Error during auto-refresh:", e));
    }, 5 * 60 * 1000);
  })
  .catch(e=> {
    console.error('Error loading/plotting data', e);
    document.body.innerHTML += `<div style="color:red;padding:20px;text-align:center">Error loading data: ${e.message}</div>`;
  });
  </script>
</body>
</html>
