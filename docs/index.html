<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Home Office Metrics</title>

    <!-- Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.5.43/moment-timezone-with-data.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom styles -->
    <style>
      /* Base styles */
      body {
        background-color: #2a2a2b;
        color: #eee;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      
      /* Canvas styles */
      canvas {
        background-color: transparent !important;
      }
      
      /* Chart container styles */
      .chart-wrapper {
        position: relative;
        border: none;
        border-radius: 0.375rem;
        background: transparent;
        height: 100%;
      }
      
      /* Icon styles */
      .home-icon {
        display: inline-block;
        width: 1.5em;
        height: 1.5em;
        vertical-align: middle;
      }
      
      /* Loading overlay */
      #loadingOverlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: rgba(0, 0, 0, 0.7);
        z-index: 50;
      }
      
      /* Desktop/laptop view - ensure equal sized charts */
      @media (min-width: 768px) {
        .chart-grid {
          display: grid;
          grid-template-columns: 1fr 1fr;
          grid-template-rows: 1fr 1fr;
          gap: 1rem;
          height: calc(100vh - 80px);
        }
        
        .chart-wrapper {
          min-height: 300px;
        }
      }
      
      /* Handle very small screens */
      @media (max-height: 600px) {
        .chart-grid {
          grid-template-rows: repeat(4, 40vh);
          overflow-y: auto;
          height: auto;
          padding-bottom: 1rem;
        }
      }
      
      /* Time filter buttons */
      .time-filter-btn {
        background-color: #444;
        color: #eee;
        padding: 0.25rem 0.75rem;
        border-radius: 0.375rem;
        font-size: 0.875rem;
        transition: all 0.2s;
        border: 1px solid #555;
        min-width: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      
      .time-filter-btn:hover:not(:disabled) {
        background-color: #555;
      }
      
      .time-filter-btn.active {
        background-color: #3b82f6;
        border-color: #2563eb;
      }
      
      .time-filter-btn:disabled {
        cursor: not-allowed;
      }
      
      .time-range-indicator {
        height: 3px;
        margin-top: 3px;
        background-color: rgba(255, 255, 255, 0.5);
        border-radius: 2px;
      }
      
      .time-range-indicator-1h { width: 20px; }
      .time-range-indicator-6h { width: 40px; }
      .time-range-indicator-24h { width: 60px; }
      .time-range-indicator-7d { width: 80px; }
      
      @media (max-width: 640px) {
        .time-filter-btn {
          padding: 0.2rem 0.5rem;
          font-size: 0.75rem;
          min-width: 50px;
        }
        .time-range-indicator-1h { width: 15px; }
        .time-range-indicator-6h { width: 30px; }
        .time-range-indicator-24h { width: 45px; }
        .time-range-indicator-7d { width: 60px; }
      }
    </style>
  </head>

  <body>
    <div class="min-h-screen flex flex-col p-2 md:p-4">
      <!-- Header -->
      <header class="relative text-center py-2 mb-2">
        <button id="refreshButton" class="absolute right-0 top-0 bg-blue-600 hover:bg-blue-700 text-white p-2 rounded-md flex items-center transition-colors md:p-2 md:right-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
          <span class="hidden md:inline ml-1">Refresh</span>
        </button>
        <h1 class="text-white text-2xl md:text-3xl font-bold flex items-center justify-center">
          Home Office Metrics
          <svg class="home-icon ml-2" fill="white" viewBox="0 0 576 512">
            <path d="M575.8 255.5c0 18-15 32.1-32 32.1h-32l.7 160.2c0 2.7-.2 5.4-.5 8.1V472c0 22.1-17.9 40-40 40h-16c-1.1 0-2.2 0-3.3-.1c-1.4 .1-2.8 .1-4.2 .1H392c-22.1 0-40-17.9-40-40v-88c0-17.7-14.3-32-32-32h-64c-17.7 0-32 14.3-32 32v88c0 22.1-17.9 40-40 40h-55.9c-1.5 0-3-.1-4.5-.2c-1.2 .1-2.4 .2-3.6 .2h-16c-22.1 0-40-17.9-40-40V360c0-.9 0-1.9 .1-2.8v-69.6H32c-18 0-32-14-32-32.1c0-9 3-17 10-24L266.4 8c7-7 15-8 22-8s15 2 21 7l255.4 224.5c8 7 12 15 11 24z"/>
          </svg>
        </h1>
        
        <!-- Time Range Filters -->
        <div class="time-filters flex justify-center mt-2 space-x-2 md:space-x-4">
          <button class="time-filter-btn active" data-minutes="0" title="Shows the most recent hour with 3-minute intervals">
            <span class="block text-xs md:text-sm">All</span>
            <span class="text-xs text-gray-300">3min default</span>
            <div class="time-range-indicator time-range-indicator-1h"></div>
          </button>
          <button class="time-filter-btn" data-minutes="3">
            <span class="block text-xs md:text-sm">3min</span>
            <span class="text-xs text-gray-300">Last 1h</span>
            <div class="time-range-indicator time-range-indicator-1h"></div>
          </button>
          <button class="time-filter-btn" data-minutes="5">
            <span class="block text-xs md:text-sm">5min</span>
            <span class="text-xs text-gray-300">Last 6h</span>
            <div class="time-range-indicator time-range-indicator-6h"></div>
          </button>
          <button class="time-filter-btn" data-minutes="10">
            <span class="block text-xs md:text-sm">10min</span>
            <span class="text-xs text-gray-300">Last 24h</span>
            <div class="time-range-indicator time-range-indicator-24h"></div>
          </button>
          <button class="time-filter-btn" data-minutes="20">
            <span class="block text-xs md:text-sm">20min</span>
            <span class="text-xs text-gray-300">Last 7d</span>
            <div class="time-range-indicator time-range-indicator-7d"></div>
          </button>
        </div>
      </header>
      
      <!-- Chart Grid -->
      <div class="chart-grid flex-1 grid gap-3 md:gap-4 overflow-auto">
        <div class="chart-wrapper p-2 md:p-3">
          <canvas id="temperatureChart"></canvas>
        </div>
        <div class="chart-wrapper p-2 md:p-3">
          <canvas id="humidityChart"></canvas>
        </div>
        <div class="chart-wrapper p-2 md:p-3">
          <canvas id="co2Chart"></canvas>
        </div>
        <div class="chart-wrapper p-2 md:p-3">
          <canvas id="lightChart"></canvas>
        </div>
      </div>
    </div>

    <!-- App logic -->
    <script src="app.js"></script>
    <script>
      // App initialization
      document.addEventListener('DOMContentLoaded', function() {
        // Initialize UI components and event handlers
        initializeApp();
      });
      
      // Main app initialization
      function initializeApp() {
        // Initialize chart layout based on screen size
        adjustLayoutForScreenSize();
        
        // Setup event listeners
        window.addEventListener('resize', handleResize);
        document.getElementById('refreshButton').addEventListener('click', refreshData);
        
        // Setup time filter buttons
        setupTimeFilters();
        
        // Load initial data
        refreshData();
      }
      
      // Resize handler
      function handleResize() {
        adjustLayoutForScreenSize();
        
        // Resize any existing charts
        if (charts && charts.length > 0) {
          charts.forEach(chart => {
            if (chart) chart.resize();
          });
        }
      }
      
      // Function to set appropriate layout based on screen size
      function adjustLayoutForScreenSize() {
        const chartGrid = document.querySelector('.chart-grid');
        const isDesktop = window.innerWidth >= 768;
        
        // For mobile: single column layout
        if (!isDesktop) {
          chartGrid.classList.add('grid-cols-1');
          chartGrid.classList.remove('grid-cols-2');
          
          // Set fixed height for mobile chart containers
          const chartWrappers = document.querySelectorAll('.chart-wrapper');
          const heightValue = window.innerHeight * 0.6 + 'px';
          
          chartWrappers.forEach(wrapper => {
            wrapper.style.height = heightValue;
          });
        } 
        // For desktop: 2x2 grid layout
        else {
          chartGrid.classList.add('grid-cols-2');
          chartGrid.classList.remove('grid-cols-1');
          
          // Let the CSS handle the height for desktop
          const chartWrappers = document.querySelectorAll('.chart-wrapper');
          chartWrappers.forEach(wrapper => {
            wrapper.style.height = '';
          });
        }
      }
      
      // Show status message overlay
      function showLoadingMessage(message) {
        console.log(message);
        
        // Create or update loading overlay
        let loadingOverlay = document.getElementById('loadingOverlay');
        if (!loadingOverlay) {
          loadingOverlay = document.createElement('div');
          loadingOverlay.id = 'loadingOverlay';
          document.body.appendChild(loadingOverlay);
        }
        
        loadingOverlay.innerHTML = `
          <div class="bg-gray-800 rounded-lg p-4 max-w-md text-center">
            <p class="text-white text-lg mb-2">${message}</p>
          </div>
        `;
      }
      
      // Function to set up time filter buttons
      function setupTimeFilters() {
        const filterButtons = document.querySelectorAll('.time-filter-btn');
        
        filterButtons.forEach(button => {
          button.addEventListener('click', function() {
            // Don't do anything if we're still loading
            if (isLoading) return;
            
            // Update active class
            filterButtons.forEach(btn => btn.classList.remove('active'));
            this.classList.add('active');
            
            // Get minutes value from data attribute
            const minutes = parseInt(this.getAttribute('data-minutes'), 10);
            console.log('Filter button clicked:', minutes + 'm');
            
            // Set the global activeTimeFilter variable - this will trigger the filter
            window.activeTimeFilter = minutes;
          });
        });
      }
    </script>
  </body>
</html>
