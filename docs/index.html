<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport"
          content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>My Room Conditions</title>

    <!-- Highcharts core + dark theme -->
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <script src="https://code.highcharts.com/themes/dark-unica.js"></script>

    <!-- moment for timezone handling -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.5.43/moment-timezone-with-data.min.js"></script>

    <!-- Semantic UI just for layout/icons (optional) -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.4.1/semantic.min.css" />
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.4.1/components/icon.min.css" />

    <style>
      body {
        background: #2a2a2b;
        color: #eee;
        padding: 1rem;
      }
      h1 {
        text-align: center;
        margin-bottom: 1.5rem;
      }
      .ui.grid > .column {
        padding: 0.5rem;
      }
    </style>
  </head>

  <body>
    <div class="ui container">
      <h1 class="ui header">
        My Room Conditions <i class="home icon"></i>
      </h1>
      <div class="ui stackable grid">
        <div id="temperature" class="eight wide column" style="height: 350px;"></div>
        <div id="humidity"    class="eight wide column" style="height: 350px;"></div>
        <div id="pressure"    class="eight wide column" style="height: 350px;"></div>
        <div id="light"       class="eight wide column" style="height: 350px;"></div>
      </div>
    </div>

    <!-- Your app logic -->
    <script src="app.js"></script>
    <script>
      // Kick things off
      retrieveData()
        .then(data => renderCharts(data))
        .catch(err => console.error(err));
    </script>
  </body>
</html>
